spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,VALUE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  h2:
    console:
      enabled: false

mybatis:
  mapper-locations: classpath:mapper/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 0

resetPassword: 123456

# 测试全流程需读取回显验证码(sendResetCode → retrievePassword)
security:
  expose-reset-code: true

files:
  uploads:
    path: uploads/
    baseUrl: http://localhost:1000/file
