server:
  ip: localhost
  port: 1000
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript
    min-response-size: 1024

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/template_v3?useUnicode=true&useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: template-hikari
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    date-format: "yyyy-MM-dd HH:mm:ss"
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai

mybatis:
  mapper-locations: classpath:mapper/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true

# 重置密码的默认值:**必填环境变量,不再有明文兜底**(§25:敏感配置不得提交到仓库)。
# 缺这个变量时应用启动即失败,而不是静默用 123456 —— 那种"能跑起来"最危险。
# 本地/容器怎么提供见 docs/DEVELOPMENT.md §「配置与密钥」。
resetPassword: ${RESET_PASSWORD}

# 是否在 /common/sendResetCode 响应中直接返回验证码。
# 默认 false(安全):生产/默认 profile 不回显,验证码应走短信/邮件下发;
# 仅 dev(演示)与 test profile 显式开启回显,便于页面展示。可用 EXPOSE_RESET_CODE 覆盖。
security:
  expose-reset-code: ${EXPOSE_RESET_CODE:false}

files:
  uploads:
    path: ${FILES_UPLOADS_PATH:uploads/}
    baseUrl: ${FILES_UPLOADS_BASEURL:http://localhost:1000/file}
