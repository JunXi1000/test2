server:
  ip: localhost
  port: 1000
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript
    min-response-size: 1024

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/template_v3?useUnicode=true&useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: template-hikari
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    date-format: "yyyy-MM-dd HH:mm:ss"
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai

mybatis:
  mapper-locations: classpath:mapper/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true

resetPassword: ${RESET_PASSWORD:123456}

# 是否在 /common/sendResetCode 响应中直接返回验证码(演示环境便于页面展示)。
# 接入真实短信/邮件后置为 false 并改为下发;prod profile 已显式关闭。
security:
  expose-reset-code: ${EXPOSE_RESET_CODE:true}

files:
  uploads:
    path: ${FILES_UPLOADS_PATH:uploads/}
    baseUrl: ${FILES_UPLOADS_BASEURL:http://localhost:1000/file}
