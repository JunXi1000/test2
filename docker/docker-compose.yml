# ─────────────────────────────────────────────────────────────────────────
# Nexus Market 开发环境编排
#   - 镜像只含运行环境(JDK/Maven/Node/MySQL),不含项目代码
#   - 代码通过 ../ → /workspace 挂载;改代码即时生效,无需重建镜像
#   - 首次启动自动初始化 MySQL 并导入建表脚本(见 entrypoint.sh)
#
# 用法:
#   cd docker && docker compose up -d --build    # 构建并后台启动
#   docker compose exec dev bash                 # 进入容器
#   docker compose down                          # 停止(加 -v 连 mysql 数据卷一起删)
#
# 发布为「他人可拉取」镜像:
#   docker compose build                         # 或直接 docker build ../ -f Dockerfile
#   docker tag nexus-market/dev-env:1.0 <你的registry>/nexus-dev-env:1.0
#   docker push <你的registry>/nexus-dev-env:1.0
#   他人: docker pull <你的registry>/nexus-dev-env:1.0
# ─────────────────────────────────────────────────────────────────────────
services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: nexus-market/dev-env:1.0
    container_name: nexus-dev
    environment:
      TZ: Asia/Shanghai
      # ── 下面四项都给了**本地默认值**,clone 下来 docker compose up 即可跑 ──
      # 想用真实口令:cp .env.example .env 填好即可覆盖(该文件已 gitignore)。
      # 生产不要用这些默认值 —— 应用侧在 prod profile 下对 JWT_SECRET 会**拒绝兜底、直接启动失败**,
      # 详见 docs/DEVELOPMENT.md §2.4。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: template_v3
      # 后端连的是本容器内的 MySQL,库口令与 root 同一个
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-123456}
      # 重置密码接口的默认值
      RESET_PASSWORD: ${RESET_PASSWORD:-123456}
      # 显式激活 dev profile:生产必须改成 prod(否则会落到 dev 的本地弱口令上)
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # JWT 签名密钥:留空则用应用内的本地兜底值(dev 可接受)
      JWT_SECRET: ${JWT_SECRET:-}
      # SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME 保持默认(localhost:3306 / root)即可
    ports:
      - "127.0.0.1:3306:3306"    # MySQL:仅宿主机回环,不暴露到局域网
      - "1000:1000"              # 后端 Spring Boot
      - "5173:5173"              # 前端 Vite dev server
    volumes:
      - ../:/workspace                          # 项目代码(不打包进镜像,运行挂载)
      - mysql-data:/var/lib/mysql               # MySQL 数据持久化
      - m2cache:/root/.m2                       # Maven 依赖缓存,避免每次下载
      - node_modules:/workspace/web/node_modules # 前端依赖缓存(隔离宿主机 win32 二进制)
    working_dir: /workspace
    tty: true
    stdin_open: true
    restart: unless-stopped

volumes:
  mysql-data:
  m2cache:
  node_modules:
