# ─────────────────────────────────────────────────────────────────────────
# Nexus Market 开发环境编排
#   - 镜像只含运行环境(JDK/Maven/Node/MySQL + 已预热的依赖),不含项目代码
#   - 代码通过 ../ → /workspace 挂载;改代码即时生效,无需重建镜像
#   - 首次启动自动初始化 MySQL 并导入建表脚本(见 entrypoint.sh)
#
# ── 给「刚 clone 下来的人」──────────────────────────────────────────────
#   在**仓库根目录**执行(Windows 双击 start.bat 即可):
#     ./start.sh          # 拉镜像 → 起容器 → 等前后端就绪 → 打印地址
#     ./stop.sh           # 停止(数据保留)
#   或手动:
#     docker compose -f docker/docker-compose.yml pull    # 拉取环境镜像(优先)
#     docker compose -f docker/docker-compose.yml up -d   # 启动(拉不到才本地构建)
#
# ── 给「维护者」:构建并推送到 ghcr.io ──────────────────────────────────
#     docker login ghcr.io -u <你的GitHub用户名>          # 口令用 PAT(classic,勾 write:packages)
#     docker compose -f docker/docker-compose.yml build
#     docker compose -f docker/docker-compose.yml push
#   或直接用脚本: docker/scripts/publish-image.sh [tag]
#   推完记得把 GHCR 上的 package 可见性改成 **public**,否则别人 pull 要登录。
# ─────────────────────────────────────────────────────────────────────────
# ⚠️ 本文件**只用于本机开发环境** —— 唯一的服务就叫 `dev`(容器 nexus-dev),
#    里面所有默认值都是本地弱值(见下方 environment 段的说明)。
#    ⚠️ 端口**并非全部绑回环**:只有 MySQL 是 `127.0.0.1:3306:3306`;
#    后端 `1000` 与前端 `5173` 是裸映射,Docker 默认绑 `0.0.0.0` ⇒ **局域网内其它设备可访问**。
#    不想要就给这两条加 `127.0.0.1:` 前缀(代价:手机/其它机器无法再访问 dev server)。
#    详见 docker/README.md 的「1000 / 5173 呢?」一节。
#
#    **不要把本文件用于生产部署。** 生产请另写一份 compose / 部署清单,全部由环境变量提供:
#      · MYSQL_ROOT_PASSWORD / SPRING_DATASOURCE_PASSWORD / RESET_PASSWORD 均必填;
#      · SPRING_PROFILES_ACTIVE=prod;
#      · JWT_SECRET 必填(本应用在 prod profile 下缺失会**拒绝启动**,不会退化)。
services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${DEV_ENV_IMAGE:-ghcr.io/junxi1000/nexus-dev-env:1.0}
    container_name: nexus-dev
    # ── entrypoint 用**挂载进来的仓库副本**,不是镜像里 COPY 进去的那份 ──
    # 起因:Dockerfile 的 `COPY docker/entrypoint.sh` 把脚本固化进构建产物,仓库随后改了它也
    # 测不出来。镜像里那份跑的是 `npm run dev`(绑 127.0.0.1),而 Docker 的 5173:5173 是把流量
    # DNAT 到容器 eth0 —— 于是「容器一起来,前端在宿主机就打不开」,且 `docker compose up -d`
    # 复用旧镜像,照抄 README 也修不好(README 写的 `--build` 才能换掉它)。
    # 挂载之后 entrypoint.sh 归仓库管:改完 `docker compose up -d` 重建容器即生效,无需 --build。
    #
    # 用 `tr -d '\r'` 过一道再执行,是**必需的**而非洁癖:现在跑的是**工作区副本**,而本仓库位于
    # OneDrive 目录、工作区文件普遍是 CRLF(.gitattributes 里 eol=lf 只覆盖了少数文件,且对已检出的
    # 文件不追溯)。CR 会让 `set -e` 变成 `set -e\r` → bash 直接报 `set: -: invalid option`。
    # 实测:printf 'set -e\r\n...' | bash → 「invalid option」。
    # 注意 `.gitattributes` 已写 `docker/entrypoint.sh text eol=lf`,入库内容仍是 LF;这里防的是
    # 本地被编辑器/同步客户端写回 CRLF 的情况。
    # 另外用 `bash` 而非直接执行,以绕开 Windows 挂载卷上可执行位不可靠的问题。
    entrypoint:
      - /bin/bash
      - -c
      - tr -d '\r' < /workspace/docker/entrypoint.sh > /tmp/entrypoint.sh && exec /bin/bash /tmp/entrypoint.sh
    environment:
      TZ: Asia/Shanghai
      # ── 下面四项都给了**本地默认值**,clone 下来 docker compose up 即可跑 ──
      # 想用真实口令:cp .env.example .env 填好即可覆盖(该文件已 gitignore)。
      #
      # ⚠️ 这些默认值使本文件成为 **fail-open** 的:忘设环境变量就会静默用 123456。
      #    对**本机开发**这是常见且可接受的(3306 只绑 127.0.0.1,见下方 ports)。
      #    **生产部署必须显式提供这三项,并设 SPRING_PROFILES_ACTIVE=prod。**
      #    最要紧的那一项(JWT 签名密钥)刻意**不给默认值**:未提供时应用只生成一次性随机密钥,
      #    prod profile 下更会直接拒绝启动 —— 公开的签名密钥等于任何人都能伪造 token。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: template_v3
      # 后端连的是本容器内的 MySQL,库口令与 root 同一个
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-123456}
      # 重置密码接口的默认值
      RESET_PASSWORD: ${RESET_PASSWORD:-123456}
      # 显式激活 dev profile:生产必须改成 prod(否则会落到 dev 的本地弱口令上)
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # JWT 签名密钥:留空则用应用内的本地兜底值(dev 可接受)
      JWT_SECRET: ${JWT_SECRET:-}
      # SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME 保持默认(localhost:3306 / root)即可
    ports:
      # 只有 MySQL 绑了回环。1000/5173 是裸映射 ⇒ 绑 0.0.0.0 ⇒ 局域网可达(见文件头说明)。
      - "127.0.0.1:3306:3306"    # MySQL:仅宿主机回环,不暴露到局域网
      - "1000:1000"              # 后端 Spring Boot —— 局域网可达
      - "5173:5173"              # 前端 Vite dev server —— 局域网可达(它会提供源码,留意)
    volumes:
      - ../:/workspace                          # 项目代码(不打包进镜像,运行挂载)
      - mysql-data:/var/lib/mysql               # MySQL 数据持久化
      - m2cache:/root/.m2                       # Maven 依赖缓存,避免每次下载
      - node_modules:/workspace/web/node_modules # 前端依赖缓存(隔离宿主机 win32 二进制)
    working_dir: /workspace
    tty: true
    stdin_open: true
    restart: unless-stopped

volumes:
  mysql-data:
  m2cache:
  node_modules:
